[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-code-review"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
code-review = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "evals*", "examples*", "code_review*"]
